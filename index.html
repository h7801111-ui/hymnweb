<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#003366">    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>찬송가</title>

<style>

body{
    font-family:sans-serif;
    margin:3px;
    max-width:605px;
    margin-left:5px;
    margin-right:5px;
}
input{
    width:99%;
    height:40px;
    font-size:18px;
    box-sizing:border-box;
}
button{
    width:24%;
    height:40px;
    font-size:18px;
    margin-top:3px;
}
@media (max-width:600px){

    button{
        height:40px;
        font-size:18px;
    }
}
#lyrics{
    white-space:pre-wrap;
    margin-top:20px;
    font-size:19px;
    line-height:0.7;
}

#title{
    font-size:25px;
    font-weight:bold;
    text-align:center;
    margin-top:15px;
    margin-bottom:15px;
    color:#003366;
}

</style>

</head>

<body>

<input
    id="number"
    type="text"
    placeholder="찬송가 장 또는 가사 입력"
    enterkeyhint="search"
    onkeydown="
        if(event.key==='Enter'){
            showHymn();}">

<div>

<button onclick="prevHymn()">◀ 이전 </button>

<button onclick="nextHymn()"> 다음 ▶</button>

<button onclick="playHymn()">🎵 듣기</button>

<button onclick="stopHymn()">■ 정지</button>

</div>

<div id="title"></div>
<div id="lyrics"></div>
<div id="resultList"></div>

<img
   
    id="score"
       style="
        width:600px;
        max-width:100%;
        height:auto;
        display:block;
        margin:20px auto;
    "
    onerror="this.style.display='none'">

<script>

let hymnText = "";
let currentNumber = 1;
let audio = null;
let autoPlay = false;   // true 이면 한 곡이 끝날 때 다음 장을 자동 재생

fetch("hymns.txt")
.then(response => response.text())
.then(text => {
    hymnText = text;
});

function showHymn(){

// 직접 검색/이동하면 연속 재생은 중단
autoPlay = false;

if(audio){

    audio.pause();

    audio.currentTime = 0;
}

   const input =
        document.getElementById("number")
        .value
        .trim();

    if(!input) return;
   
    // 숫자 검색

    if(!isNaN(input)){

        const num = parseInt(input);

        currentNumber = num;

        const regex =
            new RegExp(
                num + "\\.([\\s\\S]*?)(?=\\n\\d+\\.|$)"
            );

        const match =
            hymnText.match(regex);

      if(match){

    let hymnTextHtml =
     (num + "." + match[1])
     .replace(
        /후렴\s*:?([^\n]*)/g,
        '<span style="color:#4CAF50;font-weight: 600;">후렴 :$1</span>'
    )
    .replace(/\n/g,"<br>");

document
.getElementById("lyrics")
.innerHTML =
    hymnTextHtml;

      document
      .getElementById("resultList")
      .innerHTML = "";

      const fileName =
        "images/hymn" +
        String(num).padStart(3,"0")
        + ".jpg";

      console.log("파일명=", fileName);

      const score =
       document.getElementById("score");

     score.style.display = "block";

    score.src = fileName;

    document.getElementById("number").blur();
          
}else{

            document
            .getElementById("lyrics")
            .innerText =
            "찬송가 없음";
        }

        return;
    }

   // 가사 전체 검색

const keyword =
    input.replace(/\s/g,"");

let results = [];

for (const match of hymnText.matchAll(/(\d+)\.\s([\s\S]*?)(?=\n\d+\.|$)/g)) {

    const number = match[1];
    const hymn = match[2];

   const searchText =
    hymn
         .replace(/후렴/g,"")
        .replace(/:/g,"")
        .replace(/\s/g,"");

if (searchText.includes(keyword)) {

    const title =
        hymn
            .split("\n")[0]
            .trim();

    results.push({
        number,
        title
    });
 }
}

    if(results.length === 0){

        document
        .getElementById("lyrics")
        .innerText =
        "검색 결과 없음";

        document
        .getElementById("resultList")
        .innerHTML = "";

        return;
    }

    let html = "";

    results.forEach(item=>{

        html += `
        <div
        style="
            cursor:pointer;
            padding:5px;
            border-bottom:1px solid #ddd;
            font-size:18px;"
        onclick="openHymn(${item.number})">

        ${item.number}. ${item.title}

        </div>
        `;
    });

    document
    .getElementById("lyrics")
    .innerText =
    "검색 결과";

    document
    .getElementById("resultList")
    .innerHTML =
    html;

    document.getElementById("number").blur();
    
}

function prevHymn(){

    if(currentNumber <= 1)
        currentNumber = 1;
    else
        currentNumber -= 1;

    document
    .getElementById("number")
    .value =
    currentNumber;

    showHymn();
}

function nextHymn(){

    currentNumber+=1;

     if(currentNumber > 803)
        currentNumber = 803;

    document
    .getElementById("number")
    .value =
    currentNumber;

    showHymn();
}

function prevHymn1(){

    if(currentNumber <= 1)
        return;

    currentNumber--;

    document
    .getElementById("number")
    .value =
    currentNumber;

    showHymn();
}

function nextHymn1(){

    if(currentNumber >= 803)
        return;

    currentNumber++;

    document
    .getElementById("number")
    .value =
    currentNumber;

    showHymn();
}
  
function openHymn(number){

    currentNumber = number;

    document
    .getElementById("resultList")
    .innerHTML = "";

    const regex =
        new RegExp(
            number + "\\.([\\s\\S]*?)(?=\\n\\d+\\.|$)"
        );

    const match =
        hymnText.match(regex);

    if(match){

        let hymnTextHtml =
        (number + "." + match[1])
        .replace(
            /후렴\s*:?([^\n]*)/g,
            '<span style="color:#4CAF50;font-weight: 600;">후렴 :$1</span>'
        )
        .replace(/\n/g,"<br>");

        document
        .getElementById("lyrics")
        .innerHTML =
        hymnTextHtml;

        const fileName =
            "images/hymn" +
            String(number).padStart(3,"0")
            + ".jpg";

        const score =
            document.getElementById("score");

        score.style.display = "block";

        score.src = fileName;
    }
}

// ===== 듣기 (연속 재생, 화면 꺼짐 대응) =====

let nextBlobUrl = null;     // 미리 받아 둔 다음 장 음원 (메모리)
let nextBlobNumber = 0;
let currentBlobUrl = null;
let errorRetry = 0;

function mp3Path(n){
    return "mp3/" + String(n).padStart(3,"0") + ".mp3";
}

function setPlaybackState(state){
    if("mediaSession" in navigator){
        navigator.mediaSession.playbackState = state;
    }
}

function updateMediaSession(){
    if(!("mediaSession" in navigator)) return;
    try{
        navigator.mediaSession.metadata = new MediaMetadata({
            title: currentNumber + "장",
            artist: "찬송가",
            album: "찬송가"
        });
    }catch(e){}
}

// 잠금화면/알림창 재생 컨트롤 등록
function setupMediaSession(){
    if(!("mediaSession" in navigator)) return;
    const ms = navigator.mediaSession;
    const set = (name, fn) => {
        try{ ms.setActionHandler(name, fn); }catch(e){}
    };
    set("play", () => {
        autoPlay = true;
        if(audio && audio.src && audio.paused && !audio.error && !audio.ended){
            audio.play().catch(() => playCurrent());
        }else{
            playCurrent();
        }
    });
    set("pause", () => { if(audio) audio.pause(); });
    set("stop", () => stopHymn());
    set("nexttrack", () => skip(1));
    set("previoustrack", () => skip(-1));
}

function ensureAudio(){
    if(audio) return;
    audio = new Audio();
    audio.preload = "auto";
    audio.addEventListener("ended", playNext);
    audio.addEventListener("playing", () => {
        errorRetry = 0;
        setPlaybackState("playing");
    });
    audio.addEventListener("pause", () => setPlaybackState("paused"));
    audio.addEventListener("error", onAudioError);
    setupMediaSession();
}

// 로드 실패: 잠깐 뒤 두 번까지 재시도, 그래도 안 되면 정지
function onAudioError(){
    if(!autoPlay) return;
    if(errorRetry >= 2){
        autoPlay = false;
        setPlaybackState("paused");
        if(!document.hidden){
            alert(currentNumber + "장 음원을 재생할 수 없어 멈춥니다.");
        }
        return;
    }
    errorRetry++;
    setTimeout(() => { if(autoPlay) playCurrent(); }, 2000);
}

// 다음 장 음원을 미리 내려받아 둠 (화면이 꺼져 네트워크가 느려도 끊기지 않게)
async function preloadNext(){
    const n = currentNumber + 1;
    if(n > 803 || nextBlobNumber === n) return;
    try{
        const res = await fetch(mp3Path(n));
        if(!res.ok) return;
        const blob = await res.blob();
        if(currentNumber + 1 !== n) return;   // 그 사이 곡이 바뀐 경우
        if(nextBlobUrl) URL.revokeObjectURL(nextBlobUrl);
        nextBlobUrl = URL.createObjectURL(blob);
        nextBlobNumber = n;
    }catch(e){}
}

// 듣기 버튼: 현재 장부터 정지 버튼을 누를 때까지 다음 장으로 계속 재생
function playHymn(){

    if(currentNumber <= 0){
        alert("먼저 찬송가를 선택하세요.");
        return;
    }

    autoPlay = true;
    errorRetry = 0;
    playCurrent();
}

// 현재 장(currentNumber)의 음원을 재생
function playCurrent(){

    ensureAudio();

    let src = mp3Path(currentNumber);
    let usedBlob = null;

    // 미리 받아 둔 음원이 있으면 그것을 사용
    if(nextBlobUrl && nextBlobNumber === currentNumber){
        src = nextBlobUrl;
        usedBlob = nextBlobUrl;
        nextBlobUrl = null;
        nextBlobNumber = 0;
    }

    audio.src = src;

    if(currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = usedBlob;

    updateMediaSession();

    audio.play()
        .then(() => preloadNext())
        .catch((err) => {
            // 곡 전환 중 중단은 무시
            if(err && err.name === "AbortError") return;

            // 백그라운드에서 브라우저가 자동 재생을 막은 경우:
            // 연속 재생은 유지하고, 잠금화면 ▶ 버튼으로 이어서 재생
            if(err && err.name === "NotAllowedError"){
                setPlaybackState("paused");
                return;
            }
            // 그 외(파일 없음 등)는 error 이벤트에서 처리
        });
}

// 장 이동 후 바로 재생 (잠금화면 이전/다음 버튼용)
function skip(delta){
    const n = currentNumber + delta;
    if(n < 1 || n > 803) return;
    currentNumber = n;
    document.getElementById("number").value = n;
    openHymn(n);
    autoPlay = true;
    errorRetry = 0;
    playCurrent();
}

// 한 곡이 끝나면 다음 장으로
function playNext(){

    if(!autoPlay) return;

    if(currentNumber >= 803){
        autoPlay = false;
        return;
    }

    skip(1);
}

function stopHymn(){

    autoPlay = false;

    if(audio){
        audio.pause();
        audio.currentTime = 0;
    }

    setPlaybackState("paused");
}

// ===== 스와이프 기능 =====

let touchStartX = 0;
let touchStartY = 0;
let touchEndX = 0;
let touchEndY = 0;

document.addEventListener(
    "touchstart",
    function(e){
        touchStartX =
            e.changedTouches[0].screenX;

        touchStartY =
            e.changedTouches[0].screenY;
    },
    false
);

document.addEventListener(
    "touchend",
    function(e){
        touchEndX =
            e.changedTouches[0].screenX;

        touchEndY =
            e.changedTouches[0].screenY;

        handleSwipe();
    },
    false
);

function handleSwipe(){

    const deltaX =
        touchEndX - touchStartX;

    const deltaY =
        Math.abs(
            touchEndY - touchStartY
        );

    // 세로 이동이 크면 스와이프 무시
    if(deltaY > 70)
        return;

    if(deltaX > 300){

        prevHymn1();
    }

    if(deltaX < -300){

        nextHymn1();
    }
}
</script>

</body>
</html>
